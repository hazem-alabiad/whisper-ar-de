[project]
name = "whisper-tools"
version = "1.0.0"
description = "Dual Local AI YouTube Subtitle Processing & Compressed Video Pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deep-translator>=1.11.4",
    "dotenv>=0.9.4",
    "ebooklib>=0.20",
    "markdown>=3.10.2",
    "mlx-lm>=0.31.3",
    "mlx-whisper>=0.4.3",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "reportlab>=5.0.0",
    "sacremoses>=0.1.1",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "yt-dlp>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
whisper-tools = "whisper_tools.main:main"

[tool.pyright]
reportMissingImports = false
reportMissingModuleSource = false

